name: Retry After Melon Lock

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wait-after-lock:
    runs-on: ubuntu-22.04
    timeout-minutes: 65
    steps:
      - name: Wait one hour after Melon lock
        run: sleep 3600

  retry-ticket-scraper:
    needs: wait-after-lock
    # Only the write phase shares the Notion lock; waiting must not block other runs.
    concurrency:
      group: notion-ticket-schedule
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    env:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_PAGE_ID: ${{ secrets.NOTION_PAGE_ID }}
      NOTION_DB_ID: ${{ secrets.NOTION_DB_ID }}
      NOTION_ACT_DB_ID: ${{ secrets.NOTION_ACT_DB_ID }}
      NOTION_TITLE_DB_ID: ${{ secrets.NOTION_TITLE_DB_ID }}
      GB_ICAL_URL: ${{ secrets.GB_ICAL_URL }}
      CHROME_BIN: /usr/bin/google-chrome
      TZ: Asia/Seoul

    permissions:
      contents: write


    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Google Chrome
        run: |
          sudo apt-get update
          wget https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt install -y ./google-chrome-stable_current_amd64.deb

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -c "from importlib.metadata import version; print('notion-client', version('notion-client'))"

      - name: Retry ticket collection once
        id: scrape
        run: python run.py

      # Notion links may already exist when scraping fails or is cancelled.
      - name: Prepare for pushing .ics files to main branch
        id: prepare_ics
        if: ${{ always() && steps.scrape.outcome != 'skipped' && steps.scrape.outcome != '' }}
        run: |
          git config --local user.email "github-actions@github.com"
          git config --local user.name "GitHub Actions"

          git fetch origin main
          git worktree add temp-main origin/main

          mkdir -p temp-main/ical_exports
          # Keep previously published URLs, including files from other runs.
          find ical_exports -maxdepth 1 -name '*.ics' -exec cp {} temp-main/ical_exports/ \;
          touch temp-main/.nojekyll

      - name: Commit & Push .ics files to main
        id: publish_ics
        if: ${{ always() && steps.prepare_ics.outcome == 'success' }}
        run: |
          cd temp-main

          git add -- ical_exports .nojekyll
          git diff --cached --quiet || git commit -m "Update .ics schedule files"
          git push origin HEAD:main

      - name: Cleanup
        if: ${{ always() && steps.publish_ics.outcome == 'success' }}
        run: |
          git worktree remove temp-main --force

      - name: Report persistent Melon lock
        if: steps.scrape.outputs.melon_locked == 'true'
        run: |
          echo "::error::Melon is still locked after the one-hour retry. Other providers were saved. No further retries in this run."
          exit 1
